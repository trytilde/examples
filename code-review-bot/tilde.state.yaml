metadata:
  name: code-review-bot
  description: GitHub pull request reviewer with Tilde MCP and a Modal sandbox.
variables:
  CODEX_REVIEW_CHATKIT_ENDPOINT_URL:
    type: string
    description: ex. https://acme.com/api/agent. The planned URL to your Tilde agent.
resources:
  chatkit/agent/code-review:
    configuration:
      local_running_endpoint: false
      provider: chatkit.http-vercel-ai-sdk
      streaming: true
      timeout_ms: 300000
    displayName: Code Review
    enabled: true
    endpointUrl: ${CODEX_REVIEW_CHATKIT_ENDPOINT_URL}
  chatkit/provider/trytilde:
    refs:
      default_agent: chatkit/agent/code-review
    defaultAgentInboxId: code-review
    desiredEnabled: true
    displayName: GitHub
    providerConfiguration: {}
    providerId: chatkit.channel.github
  credential/setup_item/github:
    credentialSourceTypeId: server_token_exchange
    desiredEnabled: true
    displayName: GitHub
    metadata:
      bindings:
        - desiredEnabled: true
          ownerId: github
          ownerType: tool_group_instance
      provider_display_name: GitHub
      provider_icon_key: github
      provider_provisioner_id: provider_provisioner.github
      source: state_import
    ownerId: github
    ownerType: state_import_credential
    providerId: github
    status: pending
  mcp/tool_provider/github:
    refs:
      resource_server_credential: credential/setup_item/github
    credentialSourceTypeId: server_token_exchange
    displayName: GitHub
    resourceServerCredentialId: null
    status: brokering_initiated
    toolGroupSourceTypeId: github
    userCredentialId: null
  credential/setup_item/modal-sandbox:
    credentialSourceTypeId: modal_custom_json_schema
    desiredEnabled: true
    displayName: Modal
    metadata:
      bindings:
        - desiredEnabled: true
          ownerId: modal-sandbox
          ownerType: tool_group_instance
      provider_display_name: Modal
      provider_icon_key: modal_sandbox
      source: state_import
    ownerId: modal-sandbox
    ownerType: state_import_credential
    providerId: modal_sandbox
    status: pending
  mcp/tool_provider/modal-sandbox:
    refs:
      resource_server_credential: credential/setup_item/modal-sandbox
    credentialSourceTypeId: modal_custom_json_schema
    displayName: Modal
    resourceServerCredentialId: null
    status: brokering_initiated
    toolGroupSourceTypeId: modal_sandbox
    userCredentialId: null
  reverse_proxy/profile/github-rest:
    refs:
      resource_server_credential: credential/setup_item/github
    baseUrl: https://api.github.com
    customHeaders: {}
    desiredEnabled: true
    displayName: GitHub REST
    ownerId: null
    providerId: github
    resourceServerCredentialId: null
    userCredentialId: null
  reverse_proxy/profile/github-git-https:
    refs:
      resource_server_credential: credential/setup_item/github
    baseUrl: https://github.com
    customHeaders: {}
    desiredEnabled: true
    displayName: GitHub Git HTTPS
    ownerId: null
    providerId: github_git_https
    resourceServerCredentialId: null
    userCredentialId: null
  reverse_proxy/profile/modal-sandbox-api:
    refs:
      resource_server_credential: credential/setup_item/modal-sandbox
    baseUrl: https://api.modal.com
    customHeaders: {}
    desiredEnabled: true
    displayName: Modal
    ownerId: null
    providerId: modal_sandbox
    resourceServerCredentialId: null
    userCredentialId: null
  mcp/server/code-review:
    refs:
      tool_provider_github: mcp/tool_provider/github
      tool_provider_modal_sandbox: mcp/tool_provider/modal-sandbox
    displayName: Code Review
    isDynamicToolDiscovery: false
    functions:
      - configuredParams: {}
        enabled: true
        toolDescription: Inspect the request-scoped code review sandbox.
        toolGroupInstanceId: modal-sandbox
        toolGroupSourceTypeId: modal_sandbox
        toolName: modal_get_sandbox
        toolSourceTypeId: modal_get_sandbox
      - configuredParams: {}
        enabled: true
        toolDescription: Read a file in the request-scoped code review sandbox.
        toolGroupInstanceId: modal-sandbox
        toolGroupSourceTypeId: modal_sandbox
        toolName: modal_read_file
        toolSourceTypeId: modal_read_file
      - configuredParams: {}
        enabled: true
        toolDescription: List a directory in the request-scoped code review sandbox.
        toolGroupInstanceId: modal-sandbox
        toolGroupSourceTypeId: modal_sandbox
        toolName: modal_list_dir
        toolSourceTypeId: modal_list_dir
      - configuredParams: {}
        enabled: true
        toolDescription: Inspect a path in the request-scoped code review sandbox.
        toolGroupInstanceId: modal-sandbox
        toolGroupSourceTypeId: modal_sandbox
        toolName: modal_stat
        toolSourceTypeId: modal_stat
      - configuredParams: {}
        enabled: true
        toolDescription: Run a bounded command in the request-scoped code review sandbox.
        toolGroupInstanceId: modal-sandbox
        toolGroupSourceTypeId: modal_sandbox
        toolName: modal_exec_command
        toolSourceTypeId: modal_exec_command
      - configuredParams: {}
        enabled: true
        toolDescription: Read pull request metadata and the current head commit.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_get_pull_request
        toolSourceTypeId: github_get_pull_request
      - configuredParams: {}
        enabled: true
        toolDescription: List changed files and patches.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_list_pull_request_files
        toolSourceTypeId: github_list_pull_request_files
      - configuredParams: {}
        enabled: true
        toolDescription: List pull request commits.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_list_pull_request_commits
        toolSourceTypeId: github_list_pull_request_commits
      - configuredParams: {}
        enabled: true
        toolDescription: Read pull request conversation comments.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_list_issue_comments
        toolSourceTypeId: github_list_issue_comments
      - configuredParams: {}
        enabled: true
        toolDescription: Read existing pull request reviews.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_list_pull_request_reviews
        toolSourceTypeId: github_list_pull_request_reviews
      - configuredParams: {}
        enabled: true
        toolDescription: Read existing inline review comments.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_list_pull_request_review_comments
        toolSourceTypeId: github_list_pull_request_review_comments
      - configuredParams: {}
        enabled: true
        toolDescription: Post one finding on a changed line.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_create_pull_request_review_comment
        toolSourceTypeId: github_create_pull_request_review_comment
      - configuredParams: {}
        enabled: true
        toolDescription: Reply in an inline review thread.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_reply_to_pull_request_review_comment
        toolSourceTypeId: github_reply_to_pull_request_review_comment
      - configuredParams: {}
        enabled: true
        toolDescription: Create a review summary using COMMENT.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_create_pull_request_review
        toolSourceTypeId: github_create_pull_request_review
      - configuredParams: {}
        enabled: true
        toolDescription: Submit a pending review using COMMENT.
        toolGroupInstanceId: github
        toolGroupSourceTypeId: github
        toolName: github_submit_pull_request_review
        toolSourceTypeId: github_submit_pull_request_review
