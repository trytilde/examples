name: Code Review Bot

on:
  pull_request:
    paths:
      - ".github/workflows/code-review-bot.yml"
      - "code-review-bot/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/code-review-bot.yml"
      - "code-review-bot/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-review-bot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code-review-bot/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          OPENAI_API_KEY: build-time-placeholder
          TILDE_API_KEY: build-time-placeholder
          TILDE_GITHUB_GIT_PROXY_PROFILE_ID: build-time-placeholder
          TILDE_MCP_SERVER_ID: build-time-placeholder
          TILDE_MODAL_PROXY_PROFILE_ID: build-time-placeholder
          TILDE_ORG_ID: build-time-placeholder
          TILDE_TEAM_ID: build-time-placeholder
          TILDE_WEBHOOK_SIGNING_KEY: build-time-placeholder
